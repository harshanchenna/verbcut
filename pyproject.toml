[project]
name = "verbcut"
version = "0.1.0"
description = "Local, transcript-based video editor: edit the words, cut the footage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
    "imageio-ffmpeg>=0.5.0",
    "python-multipart>=0.0.9",
    "av==16.1.0",
]

[project.scripts]
verbcut = "verbcut.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbcut"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
